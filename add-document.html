
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Document | Smart Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html">🔐 Smart Vault</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="add-document.html">Add Document</a>
      <a href="documents.html">My Documents</a>
      <a href="vehicle.html">Vehicle</a>
      <a href="reminders.html">Reminders</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-heading">
      <h1>Add New Document</h1>
      <p>Enter your vehicle, mobile or appliance details.</p>
    </div>

    <form id="documentForm" class="form-panel">
      <div class="form-grid">
        <div class="field">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="Vehicle">Vehicle</option>
            <option value="Mobile">Mobile</option>
            <option value="Home Appliance">Home Appliance</option>
          </select>
        </div>

        <div class="field">
          <label for="type">Document Type *</label>
          <select id="type" required>
            <option value="RC">RC</option>
            <option value="Insurance">Insurance</option>
            <option value="PUC">PUC</option>
            <option value="Vehicle Warranty">Vehicle Warranty</option>
            <option value="Vehicle Bill">Vehicle Bill</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="field full">
          <label for="name" id="nameLabel">Document / Product Name *</label>
          <input id="name" type="text" placeholder="e.g. Honda Activa or Samsung Mobile" required>
        </div>

        <div class="field">
          <label for="brand" id="brandLabel">Brand / Vehicle Number</label>
          <input id="brand" type="text" placeholder="Enter brand, model or vehicle number">
        </div>

        <div class="field">
          <label for="number" id="numberLabel">Document / Serial Number</label>
          <input id="number" type="text" placeholder="Optional">
        </div>

        <div class="field">
          <label for="issue">Purchase / Issue Date</label>
          <input id="issue" type="date">
        </div>

        <div class="field">
          <label for="expiry">Warranty / Expiry Date</label>
          <input id="expiry" type="date">
        </div>

        <div class="field full">
          <label for="documentFile">Select Document File (optional)</label>
          <input id="documentFile" type="file" accept=".pdf,.jpg,.jpeg,.png">
          <small class="muted">Only the file name is recorded; the file itself is not uploaded.</small>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Save Document</button>
        <a class="btn" href="documents.html">View Documents</a>
      </div>
    </form>
  </main>

  <footer>© 2026 Smart Document Vault | PBL Project</footer>

  <script>
    const category = document.getElementById("category");
    const type = document.getElementById("type");
    const expiry = document.getElementById("expiry");

    const types = {
      "Vehicle": [
        "RC", "Insurance", "PUC", "Vehicle Warranty", "Vehicle Bill", "Other"
      ],
      "Mobile": ["Mobile Warranty", "Mobile Bill", "Other"],
      "Home Appliance": [
        "Refrigerator Warranty", "Washing Machine Warranty",
        "TV Warranty", "AC Warranty", "Microwave Warranty",
        "Other Appliance Warranty", "Appliance Bill", "Other"
      ]
    };

    function updateTypes() {
      const previousValue = type.value;
      type.replaceChildren();

      (types[category.value] || types.Vehicle).forEach(item => {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        type.appendChild(option);
      });

      if ((types[category.value] || []).includes(previousValue)) {
        type.value = previousValue;
      }

      expiry.required = !type.value.toLowerCase().includes("bill");

      document.getElementById("nameLabel").textContent =
        category.value === "Vehicle"
          ? "Document Name *" : "Product / Appliance Name *";

      document.getElementById("brandLabel").textContent =
        category.value === "Vehicle"
          ? "Vehicle Number" : "Brand and Model";

      document.getElementById("numberLabel").textContent =
        category.value === "Mobile"
          ? "IMEI Number (optional)" : "Document / Serial Number (optional)";
    }

    category.addEventListener("change", updateTypes);
    type.addEventListener("change", () => {
      expiry.required = !type.value.toLowerCase().includes("bill");
    });

    updateTypes();
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
