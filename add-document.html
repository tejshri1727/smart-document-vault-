
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Document | Smart Document Vault</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <h1>Add New Document</h1>
    <p>Enter your vehicle, mobile or appliance details.</p>

    <form id="documentForm">
      <label for="category">Category *</label>
      <select id="category" name="category" required>
        <option value="Vehicle">Vehicle</option>
        <option value="Mobile">Mobile</option>
        <option value="Home Appliance">Home Appliance</option>
      </select>

      <label for="type">Document Type *</label>
      <select id="type" name="type" required>
        <option value="">Select Document Type</option>
      </select>

      <label for="name" id="nameLabel">Document / Product Name *</label>
      <input type="text" id="name" name="name" required
             placeholder="Enter document or product name">

      <label for="brand" id="brandLabel">Brand / Vehicle Number</label>
      <input type="text" id="brand" name="brand"
             placeholder="Enter brand or vehicle number">

      <label for="number" id="numberLabel">Document / Serial Number</label>
      <input type="text" id="number" name="number"
             placeholder="Enter document or serial number">

      <label for="issue">Purchase / Issue Date</label>
      <input type="date" id="issue" name="issue">

      <label for="expiry">Warranty / Expiry Date</label>
      <input type="date" id="expiry" name="expiry">

      <label for="file">Select Document File (optional)</label>
      <input type="file" id="file" name="file"
             accept=".pdf,.jpg,.jpeg,.png">

      <button type="submit">Save Document</button>
    </form>
  </main>

  <script>
    const category = document.getElementById("category");
    const type = document.getElementById("type");
    const expiry = document.getElementById("expiry");

    const documentTypes = {
      "Vehicle": [
        "RC",
        "Insurance",
        "PUC",
        "Vehicle Warranty",
        "Vehicle Bill",
        "Other"
      ],
      "Mobile": [
        "Mobile Warranty",
        "Mobile Bill",
        "Other"
      ],
      "Home Appliance": [
        "Refrigerator Warranty",
        "Washing Machine Warranty",
        "TV Warranty",
        "AC Warranty",
        "Microwave Warranty",
        "Other Appliance Warranty",
        "Appliance Bill",
        "Other"
      ]
    };

    function updateDocumentTypes() {
      const selectedCategory = category.value;
      const previousValue = type.value;

      type.innerHTML = '<option value="">Select Document Type</option>';

      (documentTypes[selectedCategory] || []).forEach(function(item) {
        const option = document.createElement("option");
        option.value = item;
        option.textContent = item;
        type.appendChild(option);
      });

      if ([...type.options].some(function(option) {
        return option.value === previousValue && previousValue !== "";
      })) {
        type.value = previousValue;
      }

      document.getElementById("nameLabel").textContent =
        selectedCategory === "Vehicle"
          ? "Document Name *"
          : "Product / Appliance Name *";

      document.getElementById("brandLabel").textContent =
        selectedCategory === "Vehicle"
          ? "Brand / Vehicle Number"
          : "Brand / Model";

      document.getElementById("numberLabel").textContent =
        selectedCategory === "Mobile"
          ? "IMEI Number (optional)"
          : "Document / Serial Number";

      expiry.required = !type.value.toLowerCase().includes("bill");
    }

    category.addEventListener("change", updateDocumentTypes);

    type.addEventListener("change", function() {
      expiry.required = !type.value.toLowerCase().includes("bill");
    });

    updateDocumentTypes();
  </script>

  <script type="module" src="script.js"></script>
</body>
</html>
