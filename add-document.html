<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Document - Smart Document Vault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>Smart Document Vault</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="add-document.html">Add Document</a>
            <a href="documents.html">My Documents</a>
            <a href="vehicle.html">Vehicle</a>
            <a href="reminders.html">Reminders</a>
        </div>
    </nav>


    <!-- Add Document Section -->
    <section class="features">

        <h2>Add New Document</h2>

        <p>Enter your vehicle document details below.</p>

        <br>

        <form>

            <label>Document Type</label>
            <br><br>

            <select required>
                <option value="">Select Document</option>
                <option>RC</option>
                <option>Insurance</option>
                <option>PUC</option>
                <option>Warranty</option>
                <option>Vehicle Bill</option>
            </select>

            <br><br>

            <label>Vehicle Number</label>
            <br><br>

            <input type="text" placeholder="MH12AB1234" required>

            <br><br>

            <label>Document Number</label>
            <br><br>

            <input type="text" placeholder="Enter document number" required>

            <br><br>

            <label>Issue Date</label>
            <br><br>

            <input type="date" required>

            <br><br>

            <label>Expiry Date</label>
            <br><br>

            <input type="date" required>

            <br><br>

            <label>Upload Document</label>
            <br><br>

            <input type="file">

            <br><br>

            <button type="submit" class="btn">
                Save Document
            </button>

        </form>

    </section>


    <!-- Footer -->
    <footer>

        <p>© 2026 Smart Document Vault</p>

        <p>Digital Warranty & Vehicle Document Reminder System</p>

    </footer>

</body>

</html>
