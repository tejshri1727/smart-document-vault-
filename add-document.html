<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Document | Smart Vault</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a class="brand" href="index.html">🔐 Smart Vault</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="add-document.html">Add Document</a>
      <a href="documents.html">My Documents</a>
      <a href="vehicle.html">Vehicle</a>
      <a href="reminders.html">Reminders</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-heading">
      <h1>Add New Document</h1>
      <p>Enter your vehicle, mobile or appliance details.</p>
    </div>

    <form id="documentForm" class="form-panel">
      <div class="form-grid">
        <div class="field">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="Vehicle">Vehicle</option>
            <option value="Mobile">Mobile</option>
            <option value="Home Appliance">Home Appliance</option>
          </select>
        </div>

        <div class="field">
          <label for="type">Document Type *</label>
          <select id="type" required></select>
        </div>

        <div class="field full">
          <label id="nameLabel" for="name">Document / Product Name *</label>
          <input id="name" type="text" placeholder="e.g. Honda Activa or Samsung Mobile" required>
        </div>

        <div class="field">
          <label id="brandLabel" for="brand">Brand / Vehicle Number</label>
          <input id="brand" type="text" placeholder="Enter brand, model or vehicle number">
        </div>

        <div class="field">
          <label id="numberLabel" for="number">Document / Serial Number</label>
          <input id="number" type="text" placeholder="Optional">
        </div>

        <div class="field">
          <label for="issue">Purchase / Issue Date</label>
          <input id="issue" type="date">
        </div>

        <div class="field">
          <label for="expiry">Warranty / Expiry Date</label>
          <input id="expiry" type="date">
        </div>

        <div class="field full">
          <label for="documentFile">Select Document File (optional)</label>
          <input id="documentFile" type="file" accept=".pdf,.jpg,.jpeg,.png">
          <small class="muted">Demo only: the file name is recorded, but the file itself is not uploaded.</small>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Save Document</button>
        <a class="btn" href="documents.html">View Documents</a>
      </div>
    </form>
  </main>

  <footer>© 2026 Smart Document Vault | PBL Project</footer>
  <script src="script.js"></script>
</body>
</html>
