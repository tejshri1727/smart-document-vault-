
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Documents | Smart Document Vault</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav>
    <a class="brand" href="index.html">🔐 Smart Vault</a>

    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="add-document.html">Add Document</a>
      <a href="documents.html">My Documents</a>
      <a href="vehicle.html">Vehicle</a>
      <a href="reminders.html">Reminders</a>
    </div>
  </nav>

  <main class="container">
    <div class="page-heading">
      <h1>My Document Vault</h1>
      <p>Search and manage all your saved records.</p>

      <a class="btn" href="add-document.html">
        + Add Document
      </a>
    </div>

    <div class="toolbar">
      <input
        id="search"
        type="search"
        placeholder="Search name, brand, number..."
        aria-label="Search documents"
      >

      <select id="categoryFilter" aria-label="Filter by category">
        <option value="">All Categories</option>
        <option value="Vehicle">Vehicle</option>
        <option value="Mobile">Mobile</option>
        <option value="Home Appliance">Home Appliance</option>
      </select>

      <select id="filter" aria-label="Filter by status">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Expiring Soon">Expiring Soon</option>
        <option value="Expired">Expired</option>
        <option value="No expiry date">No expiry date</option>
      </select>
    </div>

    <div id="documentList" class="document-list">
      <p>Loading documents...</p>
    </div>
  </main>

  <footer>
    © 2026 Smart Document Vault | PBL Project
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
